<!-- REGISTER FORM -->
<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/commons :: head}"></head>

<body>

<section class="register-section" id="register" xmlns:th="http://www.w3.org/1999/xhtml">
    <h1 class="border-bottom">Register</h1>
    <div class="container px-4 px-lg-5">
        <div class="row gx-4 gx-lg-5">
            <div class="col-md-10 col-lg-8 mx-auto text-center">
                <i class="far fa-paper-plane fa-2x mb-2 text-white"></i>


                <form th:object="${userRegisterBindingModel}"
                      th:action="@{/users/register}"
                      th:method="post">

                    <div>
                        <div class="col-auto">
                            <label for="inputUsername" class="col-form-label ">Username</label>
                        </div>
                        <div class="col-auto">
                            <input th:field="*{username}"
                                   required minlength="4" maxlength="20"
                                   class="form-control"
                                   id="inputUsername"
                                   type="text"
                                   placeholder="Enter username..."
                                   aria-label="Enter username..."/>
                            <small id="usernameError"
                                   class="invalid-feedback bg-danger rounded">Username length must be more than 3
                                characters</small>

                            <small th:if="${false}" id="usernameUniqueError"
                                   class="bg-danger rounded">Username is already occupied</small>
                        </div>
                    </div>

                    <div>
                        <div class="col-auto">
                            <label for="inputEmail" class="col-form-label ">Email</label>
                        </div>
                        <div class="col-auto">
                            <input th:field="*{email}"
                                   required
                                   class="form-control"
                                   id="inputEmail"
                                   type="email"
                                   placeholder="Enter email..."
                                   aria-label="Enter email..."/>
                            <small id="emailError"
                                   class="invalid-feedback  form-text bg-danger rounded">Must be valid email</small>
                        </div>
                    </div>

                    <div>
                        <div class="col-auto">
                            <label for="inputPassword" class="col-form-label ">Password</label>
                        </div>
                        <div class="col-auto">
                            <input th:field="*{password}"
                                   required minlength="4" maxlength="20"
                                   class="form-control"
                                   id="inputPassword"
                                   type="password"
                                   placeholder="Enter password..."
                                   aria-label="Enter password..."/>
                            <small id="passwordError"
                                   class="invalid-feedback  form-text bg-danger rounded">
                                Password length must be between 5 and 20 characters and passwords should match.
                            </small>
                        </div>
                    </div>

                    <div>
                        <div class="col-auto">
                            <label for="inputConfirmPassword" class="col-form-label ">Confirm Password</label>
                        </div>
                        <div class="col-auto">
                            <input th:field="*{confirmPassword}"
                                   required minlength="4" maxlength="20"
                                   class="form-control"
                                   id="inputConfirmPassword"
                                   type="password"
                                   placeholder="Repeat password..."
                                   aria-label="Repeat password..."/>
                            <small id="confirmPasswordError"
                                   class="invalid-feedback  form-text bg-danger rounded">
                                Password length must be between 5 and 20 characters and passwords should match.
                            </small>
                        </div>
                    </div>

                        <!-- TODO: I AM NOT A ROBOT / CHECK EXISTING USER -->
                        <div class="col-auto">
                            <button class="btn btn-primary" type="submit">Register</button>
                        </div>

                </form>
            </div>
        </div>
    </div>
</section>
</body>
</html>
