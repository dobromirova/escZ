<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/commons::head"></head>
<body>

<header th:replace="fragments/commons::navigation"></header>

<div class="row justify-content-center black">
    <form id="add-route-form" class="w-50 rounded text-white mt-5"

          th:action="@{/routes/add}"
          th:method="post"
          th:object="${routeAddBindingModel}"
          enctype="multipart/form-data">

        <h3 class="border-left border-light pl-2">Add a new route</h3>
        <div>
            <div class="form-group">
                <label for="inputName" class="col-form-label ">Name</label>
            </div>
            <div class="form-group">
                <input name="name"
                       th:field="*{name}"
                       th:errorclass="'is-invalid bg-danger'"
                       required minlength="1" maxlength="20"
                       type="text"
                       id="inputName"
                       class="form-control"
                       aria-describedby="inputNameError">
                <small id="inputNameError" th:errors="*{name}"
                       class="invalid-feedback rounded">Name length must be more than 3 characters</small>

            </div>
        </div>

        <div>
            <h4>Choose picture</h4>
            <form action="/" method="POST" enctype="multipart/form-data">
                <input type="hidden" id="id" name="routeId">
                <div class="form-group">
                    <label>
                        <input type="text" name="title">
                    </label>
                </div>
                <div class="image-upload">
                    <label for="picture">

                        <!-- TODO: FIX ADD PICTURES-->

                        <img src="/images/add-img.png" alt=""/>
                    </label>
                    <input style="display: none" id="picture" type="file" name="picture"/>
                </div>
                <div class="form-group">
                    <button class="btn-primary rounded">Upload Picture</button>
                </div>
            </form>
        </div>

        <div>
            <div class="form-group">
                <label for="inputDescription" class="col-form-label ">Description</label>
            </div>
            <div class="form-group">
                    <textarea th:field="*{description}"
                              th:errorclass="'is-invalid bg-danger'"
                              required minlength="5"
                              id="inputDescription"
                              class="form-control"
                              aria-describedby="inputDescriptionError"></textarea>
                <small id="inputDescriptionError"
                       class="invalid-feedback  form-text bg-danger rounded">Description length must be more than 5
                    characters</small>
            </div>
        </div>

        <div>
            <div class="form-group">
                <label for="inputGpx" class="col-form-label ">GPX Coordinates</label>
            </div>
            <div class="form-group">
                <input type="file"
                       th:field="*{gpxCoordinates}"
                       th:errorclass="'is-invalid bg-danger'"
                       required
                       id="inputGpx"
                       class="form-control-file"
                       aria-describedby="inputGpxError">
                <small id="inputGpxError"
                       class="invalid-feedback  form-text bg-danger rounded">Must be valid GPX Coordinates</small>
            </div>
        </div>

        <div>
            <div class="form-group">
                <label for="inputGradeType" class="col-form-label">Grade Level</label>
            </div>

            <div class="form-group">
                <select th:field="*{gradeType}"
                        th:errorclass="'is-invalid bg-danger'"
                        id="inputGradeType"
                        class="form-control"
                        required
                        aria-describedby="inputGradeTypeError">

                    <option value="">Select a grade</option>

                    <option th:each="grade : ${T(com.escZ.escZ.Model.Entity.Enum.GradeEnum).values()}"
                            th:value="${grade}"
                            th:text="${grade.value}">
                    </option>
                </select>

                <small id="inputGradeTypeError"
                       th:errors="*{gradeType}"
                       class="invalid-feedback rounded">
                    Please select a grade level.
                </small>
            </div>
        </div>

        <div class="d-flex justify-content-center mt-4">
            <button class="btn btn-primary btn-block w-50" type="submit">Add Route</button>
        </div>

    </form>
</div>
<footer th:replace="fragments/commons::footer">
</footer>
</body>
</html>
