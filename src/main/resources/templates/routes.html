<!-- WILL DISPLAY ROUTES UPLOADED BY OTHER USERS AND COMMENTS
 <a href="/routes/all" class="btn">To routes</a> -->
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/commons::head"></head>
<body>
<div class="wrapper">

    <header th:replace="fragments/commons::nav"></header>

    <section th:each="r : ${routes}" th:object="${r}" class="road">
        <img th:src="*{pictureUrl}" alt="Title image">
        <div>
            <h2 th:text="*{name}">Your Route</h2>
            <p th:text="*{description}">Lorem ipsum dolor sit amet consectetur adipisicing elit. Vitae alias reiciendis
                deleniti possimus nemo
                non repellendus?
                Quae atque vero modi quidem! Autem cupiditate fugit doloribus ad amet, asperiores provident commodi.</p>
            <a th:href="@{/routes/details/{id}(id = *{id})}" class="btn">Learn More</a>
        </div>
    </section>
</div>

</body>
<footer th:replace="fragments/commons::footer"></footer>
</html>
