<!-- LOGIN FORM -->
<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <meta name="description" content=""/>
    <meta name="author" content=""/>
    <title>Grayscale - Start Bootstrap Theme</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico"/>
    <!-- Font Awesome icons (free version)-->
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    <!-- Google fonts-->
    <link href="https://fonts.googleapis.com/css?family=Varela+Round" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
          rel="stylesheet"/>
    <!-- Core theme CSS (includes Bootstrap)-->
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
</head>
<body id="page-top">

<section class="login-section" id="signup" xmlns:th="http://www.w3.org/1999/xhtml">
    <div class="container px-4 px-lg-5">
        <div class="row gx-4 gx-lg-5">
            <div class="col-md-10 col-lg-8 mx-auto text-center">
                <i class="far fa-paper-plane fa-2x mb-2 text-white"></i>


                <form th:action="@{/users/login}"
                      th:method="post"
                      class="form-login"
                      id="loginForm"
                      data-sb-form-api-token="API_TOKEN">

                    <div>
                        <div class="col">
                            <input class="form-control"
                                   id="username"
                                   type="text"
                                   placeholder="Enter username..."
                                   aria-label="Enter username..."
                                   data-sb-validations="required,username"/>
                        </div>
                        <small class="invalid-feedback">
                            <span class="bg-danger">Username is not correct </span>
                        </small>
                    </div>


                        <div class="col">
                            <input class="form-control"
                                   id="password"
                                   type="password"
                                   placeholder="Enter password..."
                                   aria-label="Enter password..."
                                   data-sb-validations="required,password"/>
                        </div>

                        <div class="col-auto">
                            <button class="btn btn-primary" type="submit">Login</button>
                        </div>

                </form>
            </div>
        </div>
    </div>
</section>
</body>
</html>
