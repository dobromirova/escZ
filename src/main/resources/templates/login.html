<!-- LOGIN FORM -->
<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/commons :: head}"></head>

<body id="page-top">

<header class="masthead" th:replace="~{fragments/commons :: navigation}"></header>

<section class="login-section" id="signup" xmlns:th="http://www.w3.org/1999/xhtml">
    <div class="container px-4 px-lg-5">
        <div class="row gx-4 gx-lg-5">
            <div class="col-md-10 col-lg-8 mx-auto text-center">
                <i class="far fa-paper-plane fa-2x mb-2 text-white"></i>


                <form th:action="@{/users/login}"
                      th:method="post"
                      class="form-login"
                      id="loginForm"
                      data-sb-form-api-token="API_TOKEN">


                    <div class="col">
                        <input class="form-control"
                               id="email"
                               name="email"
                               type="email"
                               placeholder="Enter email..."
                               required/>
                    </div>


                    <div class="col">
                        <input class="form-control"
                               id="password"
                               type="password"
                               placeholder="Enter password..."
                               aria-label="Enter password..."
                               data-sb-validations="required,password"/>
                    </div>

                    <div class="col-auto">
                        <button class="btn btn-primary" type="submit">Login</button>
                    </div>

                </form>
            </div>
        </div>
    </div>
</section>
</body>
</html>
